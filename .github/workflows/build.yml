name: Build PicoFly binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    # Ubuntu image available at the 2.80 release date; see SNAPSHOT.md.
    container:
      image: ubuntu:jammy-20240808@sha256:075680e983398fda61b1ac59ad733ad81d18df4bc46411666bb8a03fb9ea0195
      # Bootstrap HTTPS before the container has its own ca-certificates package.
      options: --volume /etc/ssl/certs:/host-certs:ro
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          # Freeze all packages, including transitive dependencies, to the release date.
          printf '%s\n' \
            'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20240904T041204Z jammy main universe' \
            'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20240904T041204Z jammy-updates main universe' \
            'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20240904T041204Z jammy-security main universe' \
            > /etc/apt/sources.list
          apt-get -o Acquire::https::CaInfo=/host-certs/ca-certificates.crt update
          apt-get -o Acquire::https::CaInfo=/host-certs/ca-certificates.crt install -y \
            gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential \
            ca-certificates curl git python3

      - name: Install pinned CMake
        run: |
          curl --fail --location --retry 3 \
            https://github.com/Kitware/CMake/releases/download/v3.30.2/cmake-3.30.2-linux-x86_64.tar.gz \
            --output "$RUNNER_TEMP/cmake.tar.gz"
          printf '%s  %s\n' \
            cdd7fb352605cee3ae53b0e18b5929b642900e33d6b0173e19f6d4f2067ebf16 \
            "$RUNNER_TEMP/cmake.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cmake"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP/cmake" --strip-components=1
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cmake/bin/cmake" --version

      - name: Checkout supersnug/usk
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          repository: supersnug/usk
          # Firmware files match rehius/usk's 2.80 release.
          ref: eaceeb9538020e3e9ecd375878d25b5f2ba0fe46
          path: usk

      - name: Checkout supersnug/busk
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          repository: supersnug/busk
          # Files match rehius/busk at the 2.80 release date.
          ref: 3f715c6585140ec3ab9128a20b719f5035191374
          path: busk

      - name: Checkout raspberrypi/pico-sdk
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          repository: raspberrypi/pico-sdk
          # SDK master immediately before rehius/usk 2.80 was published (2024-09-04).
          ref: dfb573818f0f293177a89d99424c13944ef76656
          path: pico-sdk
          submodules: recursive

      - name: Checkout raspberrypi/picotool
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          repository: raspberrypi/picotool
          # Picotool develop immediately before rehius/usk 2.80 was published.
          ref: 971ee85176dd17a3bf43713cc96cd52e24b449f6
          path: picotool

      - name: Set PICO_SDK_PATH environment variable
        run: |
          echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> $GITHUB_ENV
      - name: Create symbolic link of pico_sdk_import.cmake in busk and usk sources
        run: |
          ln -s $PICO_SDK_PATH/external/pico_sdk_import.cmake $GITHUB_WORKSPACE/busk/pico_sdk_import.cmake
          ln -s $PICO_SDK_PATH/external/pico_sdk_import.cmake $GITHUB_WORKSPACE/usk/pico_sdk_import.cmake
      - name: Create 'generated' directory in usk source directory
        run: mkdir -p $GITHUB_WORKSPACE/usk/generated

      - name: Build busk
        run: |
          # Backup and modify memmap_default.ld for busk build
          cp $GITHUB_WORKSPACE/pico-sdk/src/rp2_common/pico_crt0/rp2040/memmap_default.ld $GITHUB_WORKSPACE/pico-sdk/src/rp2_common/pico_crt0/rp2040/memmap_default.ld.bak
          sed -i 's/RAM(rwx) : ORIGIN =  0x20000000, LENGTH = 256k/RAM(rwx) : ORIGIN = 0x20038000, LENGTH = 32k/g' $GITHUB_WORKSPACE/pico-sdk/src/rp2_common/pico_crt0/rp2040/memmap_default.ld
          mkdir -p $GITHUB_WORKSPACE/build/busk
          cd $GITHUB_WORKSPACE/build/busk
          cmake "$GITHUB_WORKSPACE/busk" -DFETCHCONTENT_SOURCE_DIR_PICOTOOL="$GITHUB_WORKSPACE/picotool" -DPICOTOOL_FORCE_FETCH_FROM_GIT=ON
          make
          make clean
          cd $GITHUB_WORKSPACE
          # Restore original memmap_default.ld from backup
          rm -f $GITHUB_WORKSPACE/pico-sdk/src/rp2_common/pico_crt0/rp2040/memmap_default.ld
          mv $GITHUB_WORKSPACE/pico-sdk/src/rp2_common/pico_crt0/rp2040/memmap_default.ld.bak $GITHUB_WORKSPACE/pico-sdk/src/rp2_common/pico_crt0/rp2040/memmap_default.ld

      - name: Build usk
        run: |
          mkdir -p $GITHUB_WORKSPACE/build/usk
          cd $GITHUB_WORKSPACE/build/usk
          cmake "$GITHUB_WORKSPACE/usk" -DFETCHCONTENT_SOURCE_DIR_PICOTOOL="$GITHUB_WORKSPACE/picotool" -DPICOTOOL_FORCE_FETCH_FROM_GIT=ON
          make
          make clean
          python3 $GITHUB_WORKSPACE/usk/prepare.py
          cd $GITHUB_WORKSPACE
      - name: Generate release tag
        id: tag
        run: |
          USK_VERSION_LO=$(sed -n 's/#define VER_LO \([0-9]*\)/\1/p' $GITHUB_WORKSPACE/usk/config.h)
          USK_VERSION_HI=$(sed -n 's/#define VER_HI \([0-9]*\)/\1/p' $GITHUB_WORKSPACE/usk/config.h)
          USK_VERSION=${USK_VERSION_HI}.${USK_VERSION_LO}
          RELEASE_TAG=PicoFly_${USK_VERSION}_$(date +"%Y.%m.%d_%H-%M")
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG"

      - name: Createa a release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1 at the release date
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: |
            build/usk/firmware.uf2
            build/usk/update.bin
